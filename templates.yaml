        - ./uploads/install-qga.sh

  # ===== Fedora =====
  # 文件名带构建号（44-1.7、45-1.4），每次重发都变：discover 找当前构建，checksum_pattern 找同目录的 CHECKSUM。
  # 版本 EOL 后目录会搬到 archives（下载 404 → 退避一周、旧模板保持在役），届时把 url 改到 archives 并标 eol。
  - name: fedora-42
    url: https://archives.fedoraproject.org/pub/archive/fedora/linux/releases/42/Cloud/x86_64/images/Fedora-Cloud-Base-Generic-42-1.1.x86_64.qcow2
    checksum_pattern: 'Fedora-Cloud-42-(\d+)\.(\d+)-x86_64-CHECKSUM'
    eol: true
    cloud_init: true
    customize:
      uploads:
        - ./uploads/ssh.cfg:/etc/cloud/cloud.cfg.d/50_ssh.cfg
      run:
        - ./uploads/permit-root-login.sh
        - ./uploads/install-qga.sh

  - name: fedora-43
    url: https://download.fedoraproject.org/pub/fedora/linux/releases/43/Cloud/x86_64/images/Fedora-Cloud-Base-Generic-43-1.6.x86_64.qcow2
    discover:
      index: https://download.fedoraproject.org/pub/fedora/linux/releases/43/Cloud/x86_64/images/
      pattern: 'Fedora-Cloud-Base-Generic-43-(\d+)\.(\d+)\.x86_64\.qcow2'
    checksum_pattern: 'Fedora-Cloud-43-(\d+)\.(\d+)-x86_64-CHECKSUM'
    cloud_init: true
    customize:
      uploads:
        - ./uploads/ssh.cfg:/etc/cloud/cloud.cfg.d/50_ssh.cfg
      run:
        - ./uploads/permit-root-login.sh
        - ./uploads/install-qga.sh

