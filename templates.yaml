  # ===== Alpine Linux =====
  # Alpine 为 musl/openrc 极简镜像：默认不注入网络调优（net_tuning: false）；qga 走 apk + openrc。
  # 2026-10 起上游去掉了文件名里的 generic_ 前缀（3.22.7 / 3.23.7），discover 两种都认。
  # 3.24.2 起上游不再分 bios / uefi 两个变体（只剩 alpine-3.24.3-x86_64-cloudinit-r0.qcow2，-metal 是裸金属版不要）：
  # 3.24 的 pattern 两种都认、取版本最高。模板按 SeaBIOS 启动，切换前的开机冒烟会实测它——万一新镜像只能 UEFI 启动，
  # 构建失败、旧模板原样在役、sync 报 WARN；那时把 3.24 的 url 钉回 generic_alpine-3.24.1-x86_64-bios-cloudinit-r0.qcow2 并删掉 discover。
  - name: alpineLinux-3.22
    eol: '2027-05-01'
    url: https://dl-cdn.alpinelinux.org/alpine/v3.22/releases/cloud/alpine-3.22.7-x86_64-bios-cloudinit-r0.qcow2
    discover:
      index: https://dl-cdn.alpinelinux.org/alpine/v3.22/releases/cloud/
      pattern: '(?:generic_)?alpine-3\.22\.(\d+)-x86_64-bios-cloudinit-r(\d+)\.qcow2'
    checksum: '{url}.sha512'
    cloud_init: true
    net_tuning: false
    customize:
      uploads:
        - ./uploads/ssh.cfg:/etc/cloud/cloud.cfg.d/50_ssh.cfg
        - ./uploads/resolv.conf:/etc/resolv.conf
      run:
        - ./uploads/permit-root-login.sh
        - ./uploads/install-qga.sh

  - name: alpineLinux-3.23
    eol: '2027-11-01'
    url: https://dl-cdn.alpinelinux.org/alpine/v3.23/releases/cloud/alpine-3.23.7-x86_64-bios-cloudinit-r0.qcow2
    discover:
      index: https://dl-cdn.alpinelinux.org/alpine/v3.23/releases/cloud/
      pattern: '(?:generic_)?alpine-3\.23\.(\d+)-x86_64-bios-cloudinit-r(\d+)\.qcow2'
    checksum: '{url}.sha512'
    cloud_init: true
    net_tuning: false
    customize:
      uploads:
        - ./uploads/ssh.cfg:/etc/cloud/cloud.cfg.d/50_ssh.cfg
        - ./uploads/resolv.conf:/etc/resolv.conf
      run:
        - ./uploads/permit-root-login.sh
        - ./uploads/install-qga.sh

  - name: alpineLinux-3.24
    eol: '2028-06-01'
    url: https://dl-cdn.alpinelinux.org/alpine/v3.24/releases/cloud/alpine-3.24.3-x86_64-cloudinit-r0.qcow2
    discover:
      index: https://dl-cdn.alpinelinux.org/alpine/v3.24/releases/cloud/
      pattern: '(?:generic_)?alpine-3\.24\.(\d+)-x86_64-(?:bios-)?cloudinit-r(\d+)\.qcow2'
    checksum: '{url}.sha512'
    cloud_init: true
    net_tuning: false
    customize:
      uploads:
        - ./uploads/ssh.cfg:/etc/cloud/cloud.cfg.d/50_ssh.cfg
        - ./uploads/resolv.conf:/etc/resolv.conf
      run:
        - ./uploads/permit-root-login.sh
        - ./uploads/install-qga.sh
