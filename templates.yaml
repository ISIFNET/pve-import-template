# templates.yaml —— pve-import-template 配置
#
# 设计说明
# - 镜像内的定制动作统一使用「可复用脚本」：customize.run 列表中的脚本（位于 ./uploads/）
#   会被 import.py 与 update-templates.py 共用，避免逻辑重复、便于维护。
#   * ./uploads/permit-root-login.sh   允许 root SSH 登录
#   * ./uploads/install-qga.sh         安装并启用 qemu-guest-agent（多发行版自适应）
#   * ./uploads/apply-net-tuning.sh    BBR + 网络/内核 sysctl 调优（由 import.py 默认注入，无需在此声明）
# - 网络/内核调优默认对所有模板开启；如某发行版不适用，可在该模板下加 net_tuning: false；
#   也可在命令行用 --no-tuning 全局关闭。
# - customize 支持的键：uploads（--upload）、run（--run 脚本文件）、commands（--run-command 内联命令）。

# 镜像源配置 - 用于内网环境
# 使用方法：python3 import.py local-lvm 900 --mirror aliyun
mirrors:
