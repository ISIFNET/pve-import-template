aliases:
  - &command_permit_root_login >-
    if grep -E '^PermitRootLogin\s';
    then sed -i -E 's/^(PermitRootLogin\s.*)+$/PermitRootLogin yes # \1/' /etc/ssh/sshd_config;
    else printf "\nPermitRootLogin yes\n" >> /etc/ssh/sshd_config;
    fi
  - &command_install_qma_debian >-
    apt-get update && apt-get install -y qemu-guest-agent && systemctl enable --now qemu-guest-agent
  - &command_install_qma_rhel >-
    yum install -y qemu-guest-agent || dnf install -y qemu-guest-agent 
    systemctl enable --now qemu-guest-agent


templates:
  - name: ubuntu-16.04
    url: https://cloud-images.ubuntu.com/xenial/current/xenial-server-cloudimg-amd64-disk1.img
    cloud_init: true
    customize:
      uploads:
        - ./uploads/ssh.cfg:/etc/cloud/cloud.cfg.d/50_ssh.cfg
      commands:
        - *command_permit_root_login
        - *command_install_qma_debian

