aliases:
  - &command_permit_root_login >-
    if grep -E '^PermitRootLogin\s';
    then sed -i -E 's/^(PermitRootLogin\s.*)+$/PermitRootLogin yes # \1/' /etc/ssh/sshd_config;
    else printf "\nPermitRootLogin yes\n" >> /etc/ssh/sshd_config;
    fi
  - &command_install_qma_debian >-
    set -eux
    apt-get update
    DEBIAN_FRONTEND=noninteractive apt-get install -y qemu-guest-agent
    update-rc.d qemu-guest-agent defaults || true
    mkdir -p /etc/systemd/system/multi-user.target.wants
    ln -sf /lib/systemd/system/qemu-guest-agent.service \
           /etc/systemd/system/multi-user.target.wants/qemu-guest-agent.service
  - &command_install_qma_rhel >-
    set -eux
    if ! yum install -y qemu-guest-agent; then
      dnf install -y qemu-guest-agent
    fi
    mkdir -p /etc/systemd/system/multi-user.target.wants
    ln -sf /usr/lib/systemd/system/qemu-guest-agent.service \
           /etc/systemd/system/multi-user.target.wants/qemu-guest-agent.service
  - &command_enable_bbr_optimized >-
    set -eux
    # 1) 加载 BBR 模块，开机自动加载
    modprobe tcp_bbr
    echo tcp_bbr >/etc/modules-load.d/bbr.conf

    # 2) 持久化网络内核参数
    cat <<EOF >/etc/sysctl.d/99-network-tuning.conf
    net.core.default_qdisc = fq
    net.ipv4.tcp_congestion_control = bbr

    net.ipv4.tcp_syncookies = 1
    net.ipv4.tcp_fin_timeout = 30
    net.ipv4.tcp_tw_reuse = 1
    net.ipv4.tcp_max_syn_backlog = 1024

    net.ipv4.conf.all.arp_ignore = 1
    net.ipv4.conf.all.arp_announce = 2
    net.ipv4.conf.default.arp_ignore = 1
    net.ipv4.conf.default.arp_announce = 2
    EOF


