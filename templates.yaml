# templates.yaml —— pve-import-template 配置
#
# 设计说明
# - 镜像内的定制动作统一使用「可复用脚本」（./uploads/，import.py / sync-templates.py / update-templates.py 共用）：
#   * ./uploads/permit-root-login.sh   允许 root SSH 登录（drop-in 优先，首条生效）
#   * ./uploads/install-qga.sh         安装并启用 qemu-guest-agent（多发行版自适应）
#   * ./uploads/upgrade-packages.sh    构建时把系统包升级到最新（安全补丁；失败 = 构建失败，旧模板保持在役）
#   * ./uploads/apply-net-tuning.sh    BBR + 网络/内核 sysctl 调优（默认注入，无需在此声明）
#   * ./uploads/verify-image.sh        核对 qga 已装且自启、sshd 生效配置允许 root（不达标 = 构建失败）
#   * ./uploads/finalize-image.sh      封装前清理 host key / machine-id / cloud-init 状态 / 日志 / 缓存
#   upgrade / tuning / verify / finalize 由工具自动注入，模板里只声明各自的 uploads / run。
# - 模板支持的键：
#     name        模板名（= PVE VM 名；平台按名字认模板，大小写不敏感）
#     url         下载地址（配了 discover 时作为兜底）
#     discover    {index, pattern}：从目录索引里找最新点版本（pattern 是整个文件名的正则，捕获组按数字比大小）；
#                 上游换命名时只改 pattern，不用追着改 url
#     checksum    校验文件地址，可用 {url} / {dir} 占位；支持 SHA256SUMS / SHA512SUMS / BSD 风格 / 单 hash 文件
#     checksum_pattern  校验文件名随构建号变化时（Fedora），在镜像所在目录里按正则找
#     cloud_init / net_tuning / upgrade（默认 true）/ unpack / customize{uploads,run,commands} / family
#     eol: true   已停止维护（仅提示；不进 standard / minimal 配置组）
# - 磁盘默认启用 discard 以回收精简置备存储空间，但不设置 ssd=1，不向访客伪装 SSD。

# 默认导入的主流系列：
#   * python3 import.py <storage> <vmid> 不指定模板时只导入这些系列（--all 导入全部）；
#   * run.sh / tui.py 交互向导默认勾选这些系列，其余系列作为可选。
default_families:
  - ubuntu
  - debian
  - centos
  - alpine

# 配置组：小硬盘节点不需要全部模板。选择器里写 @minimal / @standard / @full，
# 或在 /etc/pve-import-template.conf 写 PROFILE=minimal（sync-templates.py 只维护组内模板，ADD_MISSING=1 才补缺）。
profiles:
  minimal: [debian-13, debian-12, ubuntu-24.04, ubuntu-22.04, alpineLinux-3.23]
  standard: [debian-13, debian-12, ubuntu-26.04, ubuntu-24.04, ubuntu-22.04, centos-stream-9, centos-stream-10,
             almaLinux-9, almaLinux-10, rocky-9, rocky-10, alpineLinux-3.22, alpineLinux-3.23, alpineLinux-3.24]
  full: ['*']

# 镜像下载的备用站：主站下载失败（超时 / 5xx / 404）时按前缀改写地址依次尝试。校验文件仍先从主站取，
# 主站整个不通才退到备用站——这时完整性只与备用站一样可信，不信任的站不要加。
# （2026-11 实测：TUNA 同步 Ubuntu cloud images 与 Alpine；USTC 对这两类返回 403；Debian / Rocky / Alma 无 cloud 镜像）
image_mirrors:
  - from: https://cloud-images.ubuntu.com/
    to: [https://mirrors.tuna.tsinghua.edu.cn/ubuntu-cloud-images/]
  - from: https://dl-cdn.alpinelinux.org/alpine/
    to: [https://mirrors.tuna.tsinghua.edu.cn/alpine/]

# 镜像源配置 - 用于内网环境
# 使用方法：python3 import.py local-lvm 9001 --mirror aliyun
mirrors:
