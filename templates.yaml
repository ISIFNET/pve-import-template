  # ===== Arch Linux =====
  # 滚动发行、镜像每周重出：不在构建时 -Syu（大版本内核 / mkinitcpio 在 libguestfs 里跑风险大），靠重新下载拿新包
  - name: archLinux
    url: https://geo.mirror.pkgbuild.com/images/latest/Arch-Linux-x86_64-cloudimg.qcow2
    checksum: '{url}.SHA256'
    upgrade: false
    cloud_init: true
