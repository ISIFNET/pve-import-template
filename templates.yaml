    discover:
      index: https://download.fedoraproject.org/pub/fedora/linux/releases/44/Cloud/x86_64/images/
      pattern: 'Fedora-Cloud-Base-Generic-44-(\d+)\.(\d+)\.x86_64\.qcow2'
