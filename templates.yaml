  # ===== CentOS Stream =====
  # 2026-11 上游把 10-stream 改名（GenericCloud-x86_64-10-latest → GenericCloud-10-latest，旧地址 502）：
  # 用 discover 挑最新的带日期构建，新旧两种命名都认；dated 文件名稳定、有逐文件 .SHA256SUM
  - name: centos-stream-9
    url: https://cloud.centos.org/centos/9-stream/x86_64/images/CentOS-Stream-GenericCloud-9-latest.x86_64.qcow2
    discover:
