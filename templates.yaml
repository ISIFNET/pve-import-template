        - ./uploads/install-qga.sh

  # ===== Alpine Linux =====
  # Alpine 为 musl/openrc 极简镜像：默认不注入网络调优（net_tuning: false）；qga 走 apk + openrc。
  # 2026-10 起上游去掉了文件名里的 generic_ 前缀（3.22.7 / 3.23.7），discover 两种都认。
  # 3.24.2+ 的 cloud 镜像文件名里也没有 bios 了（alpine-3.24.3-x86_64-cloudinit-r0.qcow2）：是否仍可用 SeaBIOS 引导
  # 未经实测，pattern 暂只认带 bios 的变体（停在 3.24.1，安全补丁由构建时 apk upgrade 补上）；实测可用后去掉 -bios。
  - name: alpineLinux-3.22
    url: https://dl-cdn.alpinelinux.org/alpine/v3.22/releases/cloud/alpine-3.22.7-x86_64-bios-cloudinit-r0.qcow2
    discover:
      index: https://dl-cdn.alpinelinux.org/alpine/v3.22/releases/cloud/
      pattern: '(?:generic_)?alpine-3\.22\.(\d+)-x86_64-bios-cloudinit-r(\d+)\.qcow2'
    checksum: '{url}.sha512'
    cloud_init: true
    net_tuning: false
    customize:
      uploads:
        - ./uploads/ssh.cfg:/etc/cloud/cloud.cfg.d/50_ssh.cfg
        - ./uploads/resolv.conf:/etc/resolv.conf
      run:
        - ./uploads/permit-root-login.sh
        - ./uploads/install-qga.sh

  - name: alpineLinux-3.23
    url: https://dl-cdn.alpinelinux.org/alpine/v3.23/releases/cloud/alpine-3.23.7-x86_64-bios-cloudinit-r0.qcow2
    discover:
